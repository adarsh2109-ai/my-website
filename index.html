<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body {
  margin: 0;
  background-color: #111827;
  color: white;
  font-family: Arial;
}

nav {
  background-color: #1f2937;
  padding: 20px;
  text-align: center;
}

nav a {
  color: white;
  text-decoration: none;
  margin: 15px;
}

section {
  text-align: center;
  padding: 50px 20px;
}

h1 {
  font-size: 45px;
  color: #38bdf8;
}

h2 {
  color: #38bdf8;
}

.projects {
  display: flex;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
}

.card {
  background-color: #1f2937;
  padding: 25px;
  width: 220px;
  border-radius: 15px;
}

input, textarea {
  width: 80%;
  max-width: 400px;
  padding: 12px;
  margin: 8px;
  border-radius: 8px;
  border: none;
}

button {
  padding: 12px 25px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

/* 📱 Mobile */

@media (max-width: 600px) {

  h1 {
    font-size: 32px;
  }

  nav a {
    display: block;
    margin: 10px;
  }

  .card {
    width: 80%;
  }

}

</style>

</head>

<body>

<nav>
  <a href="#home">Home</a>
  <a href="#about">About</a>
  <a href="#projects">Projects</a>
  <a href="#contact">Contact</a>
</nav>

<section id="home">

<h1>Adarsh 🚀</h1>

<p>Welcome to my website!</p>

</section>

<section id="about">

<h2>About Me</h2>

<p>I am learning coding and building cool projects.</p>

</section>

<section id="projects">

<h2>My Projects</h2>

<div class="projects">

<div class="card">
<h3>🐍 Python Calculator</h3>
<p>My first Python project.</p>
</div>

<div class="card">
<h3>🎮 Mini Game</h3>
<p>A small game I created.</p>
</div>

<div class="card">
<h3>🌐 My Website</h3>
<p>My first website project.</p>
</div>

</div>

</section>

<section id="contact">

<h2>Contact Me 📩</h2>

<input type="text" placeholder="Your Name">

<br>

<input type="email" placeholder="Your Email">

<br>

<textarea rows="5" placeholder="Your Message"></textarea>

<br>

<button>Send Message</button>

</section>

</body>

</html>
